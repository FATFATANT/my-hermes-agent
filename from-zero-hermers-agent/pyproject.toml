[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "from-zero-hermers-agent"
version = "0.0.1"
description = "Incremental from-scratch learning implementation of Hermes Agent"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
hermers = "hermers_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
